<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024" role="img" aria-label="Tu Negocio en Escena">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c3170"/>
      <stop offset="1" stop-color="#070d22"/>
    </linearGradient>
    <radialGradient id="brillo" cx="0.38" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ffd08a"/>
      <stop offset="1" stop-color="#ffb547"/>
    </radialGradient>
    <mask id="creciente">
      <rect width="512" height="512" fill="#000"/>
      <circle cx="432" cy="108" r="38" fill="#fff"/>
      <circle cx="447" cy="99" r="32" fill="#000"/>
    </mask>
  </defs>
  <rect width="512" height="512" fill="url(#cielo)"/>
  <g fill="#ffd08a">
    <circle cx="96" cy="96" r="4" opacity=".8"/>
    <circle cx="150" cy="58" r="2.5" opacity=".6"/>
    <circle cx="452" cy="404" r="3" opacity=".6"/>
  </g>
  <!-- pantalla vertical (reel): el negocio en escena -->
  <rect x="150" y="86" width="212" height="340" rx="46" fill="#0b1530" stroke="url(#brillo)" stroke-width="26"/>
  <rect x="226" y="108" width="60" height="9" rx="4.5" fill="#ffd08a" opacity=".55"/>
  <!-- botón de reproducir -->
  <polygon points="226,212 226,300 304,256" fill="#4fd1c5" stroke="#4fd1c5" stroke-width="16" stroke-linejoin="round"/>
  <!-- luna: guiño a Dato de la Noche -->
  <rect width="512" height="512" fill="url(#brillo)" mask="url(#creciente)"/>
</svg>
